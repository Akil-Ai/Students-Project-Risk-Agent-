services:
  - type: web
    name: student-risk-agent-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        value: sqlite:///./data/project_agent.db
      - key: INITIAL_ADMIN_EMAIL
        value: admin@college.edu
      - key: INITIAL_ADMIN_PASSWORD
        value: Admin@123456
      - key: CORS_ORIGINS
        value: "*"
